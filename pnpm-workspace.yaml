packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# pnpm 11 requires postinstall/build scripts to be opted into explicitly.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9
