packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
  - 'infra'

# pnpm 11 requires postinstall/build scripts to be opted into explicitly.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  # Pulled in transitively by inngest -> OpenTelemetry. Its postinstall only
  # provisions the protobuf CLI tooling, which nothing here invokes; the
  # runtime encoder works without it. Denied rather than merely unlisted, so
  # the decision is recorded instead of re-prompting on every install.
  protobufjs: false
  # The Sentry CLI binary exists only to upload sourcemaps, which this app
  # deliberately does not do (see apps/web/instrumentation.ts). The SDKs
  # work without it. Denied so the decision is recorded.
  '@sentry/cli': false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9
  - aws-cdk@2.1137.0
