name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for the ephemeral CI database and mock-provider mode.
  # Nothing here is a secret: the database lives for the length of one job and
  # the keys encrypt nothing that outlives it. Real credentials are never
  # needed in CI, because every provider is mocked (build spec section 13).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boom_busters
  # The destructive suites read this, never DATABASE_URL, so they can never be
  # pointed at a deployment's database by forgetting something. Here the two
  # are the same throwaway container.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boom_busters
  AUTH_SECRET: ci-only-secret-not-used-outside-this-job-0000
  AUTH_URL: http://localhost:3100
  OWNER_EMAIL: ci@boom-busters.test
  SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  MOCK_PROVIDERS: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boom_busters
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Zero-warning policy (CLAUDE.md): `pnpm lint` passes --max-warnings 0.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Proves the checked-in migration actually applies and the seed is
      # runnable, not just that the schema compiles.
      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      # Includes the Inngest harness tests, which run the real durable
      # functions against the service container above. They need no Inngest
      # account: the SDK only talks to Inngest Cloud when NODE_ENV=production.
      - name: Unit, component and orchestration tests
        run: pnpm test

      # Run from the e2e workspace rather than through `pnpm --filter ... exec`,
      # and name the headless shell explicitly: Playwright ships it as a
      # separate download from `chromium`, and it is what the Chromium device
      # profiles actually launch. Getting only one of the two is what makes
      # every spec fail with "Executable doesn't exist".
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      # Fail here, loudly, rather than 19 tests later with a confusing message.
      - name: Verify browsers are installed
        working-directory: e2e
        run: pnpm exec playwright install --dry-run

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
